<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 120" role="img" aria-label="ExactPoint concept 2 — EP badge">
  <!-- Concept 2 · "EP Badge" — E and P share one spine inside a rounded badge;
       the P's counter holds the point. Strong at favicon size and on shirts. -->
  <rect x="10" y="10" width="100" height="100" rx="22" fill="#16233B"/>
  <g stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" fill="none">
    <line x1="44" y1="33" x2="44" y2="87"/>
    <line x1="44" y1="33" x2="72" y2="33"/>
    <line x1="44" y1="60" x2="64" y2="60"/>
    <line x1="44" y1="87" x2="72" y2="87"/>
    <path d="M72 33 a13.5 13.5 0 0 1 0 27 L64 60"/>
  </g>
  <circle cx="71" cy="46.5" r="5.5" fill="#F26A21"/>
  <g font-family="'Avenir Next','Helvetica Neue',Arial,sans-serif">
    <text x="140" y="66" font-size="44" font-weight="800" letter-spacing="2" fill="#16233B">EXACTPOINT</text>
    <text x="142" y="98" font-size="19" font-weight="600" letter-spacing="7.5" fill="#5B6B85">APPLIANCE &amp; HVAC</text>
  </g>
</svg>
